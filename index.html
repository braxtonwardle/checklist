<style>
  :root {
    --bg: #0F1A2E;
    --panel: #13203A;
    --line: #1E2C4A;
    --line2: #2C3A57;
    --ink: #F2EFE6;
    --muted: #8FA0C4;
    --muted2: #6E80A8;
    --gold: #D4A24C;
    --gold-bright: #F2C572;
    --navy-square: #16213E;
    --ivory-square: #DED6C4;
    --teal: #4C6A73;
    --olive: #7A8C4C;
    --quote-ink: #C7D0E8;
    --skip-active-bg: #2A2038;
    --mode-active-bg: #182A4A;
    --history-empty: #33465F;
    font-family: 'Georgia', 'Iowan Old Style', ui-serif, serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding: env(safe-area-inset-top, 24px) 16px calc(env(safe-area-inset-bottom, 24px) + 24px);
  }
  .wrap { width: 100%; max-width: 420px; margin: 0 auto; padding-top: 12px; }
  .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

  .quote-block { margin-bottom: 16px; text-align: center; position: relative; }
  .quote-refresh-btn {
    position: absolute; top: -2px; right: 0;
    background: transparent; border: none; color: var(--muted2);
    font-size: 14px; line-height: 1; cursor: pointer; padding: 4px;
    opacity: .5; transition: opacity .15s ease;
  }
  .quote-refresh-btn:hover { opacity: .9; }
  .quote-text { color: var(--quote-ink); font-size: 12.5px; line-height: 1.4; font-style: italic; }
  .quote-author { color: var(--muted2); font-size: 11px; margin-top: 4px; }

  .nav-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .nav-btn {
    width: 32px; height: 32px; border-radius: 8px;
    border: 1px solid var(--line2); background: transparent; color: var(--gold);
    font-size: 18px; cursor: pointer; line-height: 1;
  }
  .nav-btn:disabled { opacity: .3; cursor: default; }
  .nav-center { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .nav-date { color: var(--ink); font-size: 13.5px; }
  .jump-btn {
    background: transparent; border: none; color: var(--gold);
    font-size: 11px; cursor: pointer; text-decoration: underline; padding: 0;
  }

  .completion-bar-track { width: 100%; height: 8px; background: var(--line2); border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
  .completion-bar-fill { height: 100%; width: 0%; background: var(--gold); border-radius: 4px; transition: width .3s ease; }
  .progress-skip-text { color: var(--gold); font-variant-numeric: tabular-nums; font-size: 14px; text-align: right; margin-bottom: 8px; }

  .board {
    display: grid; grid-template-columns: 1fr 1fr; gap: 2px;
    border-radius: 10px; overflow: hidden; margin-bottom: 6px;
  }
  .square {
    position: relative;
    min-height: 60px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 5px; border: none; cursor: pointer;
    padding: 10px 8px; text-align: center; font-family: inherit;
    filter: brightness(.55); transition: filter .15s ease;
  }
  .square.has-streak { padding-bottom: 23px; }
  .square .emoji { font-size: 17px; line-height: 1; }
  .square .label { font-size: 12px; line-height: 1.25; }
  .sq-dark { background: var(--navy-square); color: var(--ink); }
  .sq-light { background: var(--ivory-square); color: var(--navy-square); }
  .sq-checked { filter: brightness(1); }
  .streak-badge {
    position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
    font-size: 11px; line-height: 1; color: var(--gold-bright); font-weight: 700;
    background: rgba(0, 0, 0, .35); border-radius: 8px; padding: 1px 6px;
  }
  .streak-star { font-size: 1.3em; vertical-align: -1px; }
  .streak-mini { font-size: 10px; opacity: .9; margin-left: 5px; color: var(--gold-bright); font-weight: 600; }

  .square:disabled { opacity: .35; cursor: default; }

  .skip-btn {
    display: block; margin: 8px auto 0; padding: 3px 6px; border-radius: 6px;
    border: none; background: transparent; color: var(--muted2);
    font-size: 10.5px; cursor: pointer; font-family: inherit; text-decoration: underline;
    opacity: .7;
  }
  .skip-btn.active { color: var(--gold); opacity: 1; text-decoration: none; background: var(--skip-active-bg); padding: 3px 8px; }

  .mode-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .mode-btn {
    flex: 1; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line2);
    background: transparent; color: var(--muted); font-size: 13px; cursor: pointer;
  }
  .mode-btn.active { background: var(--mode-active-bg); color: var(--ink); border-color: var(--gold); }

  .cluster-label {
    color: var(--muted2); font-size: 11px; letter-spacing: .12em; font-weight: 600;
    margin-bottom: 6px; margin-top: 14px;
  }

  .history-strip {
    display: flex; justify-content: space-between; align-items: flex-end;
    height: 48px; margin: 18px 4px 18px;
  }
  .history-col {
    display: flex; flex-direction: column; align-items: center; gap: 4px; width: 20px;
    background: none; border: none; cursor: pointer; padding: 0; font-family: inherit;
  }
  .history-bar { width: 10px; border-radius: 3px; }
  .history-label { color: var(--muted2); font-size: 10px; }

  .weekly { background: var(--panel); border-radius: 10px; padding: 14px 16px; }
  .weekly-header { color: var(--gold); font-size: 11px; letter-spacing: .15em; font-weight: 600; margin-bottom: 10px; }
  .recap-bar-row { display: flex; align-items: center; gap: 8px; }
  .recap-bar-row .completion-bar-track { margin-bottom: 0; }
  .recap-pct { color: var(--gold); font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .weekly-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .weekly-label { color: var(--ink); font-size: 13.5px; flex: 1; }
  .dots { display: flex; gap: 5px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--gold); display: inline-block; }
  .dot.filled { background: var(--gold); }
  .weekly-btns { display: flex; gap: 6px; }
  .small-btn, .small-btn-ghost {
    border-radius: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .small-btn { background: var(--gold); color: var(--navy-square); border: none; }
  .small-btn-ghost { background: transparent; color: var(--muted2); border: 1px solid var(--line2); }

  .footer-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .footer-btn {
    background: transparent; color: var(--muted2); border: 1px solid var(--line2);
    border-radius: 8px; padding: 8px 12px; font-size: 12.5px; cursor: pointer; font-family: inherit;
  }
  .tiny { color: var(--muted2); font-size: 11px; margin-top: 10px; line-height: 1.4; }
</style>
</head>
<body>
<div class="wrap sans">
  <div class="quote-block" style="font-family: 'Georgia', serif;">
    <button class="quote-refresh-btn" id="quoteRefreshBtn" title="New quote">↻</button>
    <div class="quote-text" id="quoteText"></div>
    <div class="quote-author" id="quoteAuthor"></div>
  </div>

  <div class="nav-row">
    <button class="nav-btn" id="prevBtn">‹</button>
    <div class="nav-center">
      <span class="nav-date" id="navDate"></span>
      <button class="jump-btn" id="jumpBtn" style="display:none;">today</button>
    </div>
    <button class="nav-btn" id="nextBtn">›</button>
  </div>

  <div id="weekdayView">
    <div class="completion-bar-track" id="progressTrack"><div class="completion-bar-fill" id="progressFill"></div></div>
    <div class="progress-skip-text" id="progressSkipText" style="display:none;"></div>
    <div class="board" id="weekdayBoard"></div>
    <button class="skip-btn" id="skipDayBtn">🤒 Sick / vacation — skip today</button>
  </div>

  <div id="weekendView" style="display:none;">
    <div class="completion-bar-track" id="weekendProgressTrack"><div class="completion-bar-fill" id="weekendProgressFill"></div></div>
    <div class="progress-skip-text" id="weekendProgressSkipText" style="display:none;"></div>
    <div class="board" id="weekendBoard"></div>
    <button class="skip-btn" id="skipWeekendBtn">🤒 Sick / vacation — skip today</button>

    <div class="cluster-label">Weekend</div>
    <div class="mode-row">
      <button class="mode-btn" id="regularBtn">Weekend</button>
      <button class="mode-btn" id="sophieBtn">Sophie weekend</button>
    </div>
    <div class="board" id="extraBoard"></div>

    <div class="weekly" id="recapPanel" style="display:none; margin-top:14px;">
      <div class="weekly-header">Week recap</div>
      <div class="recap-bar-row">
        <div class="completion-bar-track" style="flex:1;"><div class="completion-bar-fill" id="recapFill"></div></div>
        <span class="recap-pct" id="recapPct"></span>
      </div>
      <div class="tiny" id="recapExtra" style="margin-top:6px;"></div>
    </div>
  </div>

  <div class="history-strip" id="historyStrip"></div>

  <div class="weekly">
    <div class="weekly-header">This week</div>
    <div class="weekly-row">
      <span class="weekly-label" id="medLabel">🧘 Meditation</span>
      <div class="dots" id="medDots"></div>
      <div class="weekly-btns">
        <button class="small-btn" id="medPlus">+1</button>
        <button class="small-btn-ghost" id="medReset">reset</button>
      </div>
    </div>
    <div class="weekly-row">
      <span class="weekly-label" id="cookLabel">🍳 Cooked at home</span>
      <div class="dots" id="cookDots"></div>
      <div class="weekly-btns">
        <button class="small-btn" id="cookPlus">+1</button>
        <button class="small-btn-ghost" id="cookReset">reset</button>
      </div>
    </div>
    <div class="weekly-row">
      <span class="weekly-label">🧗 Climbing/Lifting</span>
      <div class="dots" id="liftDots"></div>
    </div>
    <div class="weekly-row">
      <span class="weekly-label">🚴 Cycling</span>
      <div class="dots" id="cycleDots"></div>
    </div>
  </div>

  <div class="footer-actions">
    <button class="footer-btn" id="exportBtn">Export CSV</button>
    <button class="footer-btn" id="backupBtn">Download backup</button>
    <button class="footer-btn" id="restoreBtn">Restore backup</button>
    <input type="file" id="restoreInput" accept="application/json" style="display:none;">
  </div>
  <div class="tiny">Saves locally in this browser only. <span id="backupStatus"></span></div>
</div>

<script>
  // ---------- storage ----------
  const DAY_KEY = "wb_day_v1";
  const WEEKEND_KEY = "wb_weekend_v1";

    let cur = new Date(CHORE_ROTATION_EPOCH);
    for (let guard = 0; guard < 3000; guard++) {

  // Consecutive days matching includeDay (Mon-Fri for weekdayStreak, Sat/Sun for
  // weekendStreak) with itemKey checked, walking backward from uptoDate. A skipped
  // day is excused rather than counted as a miss. If uptoDate is genuinely today
  // and still unchecked, that day is treated as "pending" (doesn't break the
  // streak) rather than a miss.
  function dayTypeStreak(itemKey, uptoDate, includeDay) {
    let streak = 0;
    let d = new Date(uptoDate);
    d.setHours(0, 0, 0, 0);
    for (let guard = 0; guard < 500; guard++) {
      if (!includeDay(d)) { d = addDays(d, -1); continue; }
      const key = toDateKey(d);
      const entry = dayData[key];
      if (entry && entry.skip) { d = addDays(d, -1); continue; }
      const checked = !!(entry && entry.checks[itemKey]);
      const isRealToday = sameDate(d, realToday);
      if (checked) {
        streak++;
      } else if (isRealToday) {
        // in-progress day, no verdict yet
      } else {
        break;
      }
      d = addDays(d, -1);
    }
    return streak;
  }
  function weekdayStreak(itemKey, uptoDate) { return dayTypeStreak(itemKey, uptoDate, d => !isWeekendDay(d)); }
  function weekendStreak(itemKey, uptoDate) { return dayTypeStreak(itemKey, uptoDate, isWeekendDay); }
  // Some keys mean the same thing on weekdays and weekends (water/lucy/sleep
  // appear in both item lists) — for those, the streak should run across every
  // day of the week instead of resetting at the weekday/weekend boundary.
  const CROSS_DAY_STREAK_KEYS = ["water", "lucy", "sleep"];
  function unifiedStreak(itemKey, uptoDate) { return dayTypeStreak(itemKey, uptoDate, () => true); }

  // Consecutive days (every day of the week) with any activity type logged —
  // one combined streak regardless of which of the three types it was.
  function movementStreak(uptoDate) {
    let streak = 0;
    let d = new Date(uptoDate);
    d.setHours(0, 0, 0, 0);
    for (let guard = 0; guard < 500; guard++) {
      const key = toDateKey(d);
      const entry = dayData[key];
      if (entry && entry.skip) { d = addDays(d, -1); continue; }
      const checked = !!(entry && entry.checks.activity);
      const isRealToday = sameDate(d, realToday);
      if (checked) {
        streak++;
      } else if (isRealToday) {
        // in-progress day, no verdict yet
      } else {
        break;
      }
      d = addDays(d, -1);
    }
    return streak;
  }

  // Consecutive weeks meeting a weekly counter's target, walking backward from the week containing uptoDate.
  // The current in-progress week doesn't break the streak if it hasn't hit target yet.
  function weeklyCounterStreak(counterKey, target, uptoDate) {
    let streak = 0;
    let d = mondayOf(uptoDate);
    const currentWeekKey = weekKeyOf(realToday);
    for (let guard = 0; guard < 200; guard++) {
      const key = "wk-" + toDateKey(d);
      const entry = weekData[key];
      const count = entry ? (entry[counterKey] || 0) : 0;
      const isCurrentWeek = key === currentWeekKey;
      if (count >= target) {
        streak++;
      } else if (isCurrentWeek) {
        // in-progress week, no verdict yet
      } else {
        break;
      }
      d = addDays(d, -7);
    }
    return streak;
  }

  function escapeHTML(str) {
    return String(str).replace(/[&<>"']/g, s => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[s]));
  }

  function formatBackupStatus(iso) {
    if (!iso) return "Never backed up — download one below.";
    const days = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
    if (days <= 0) return "Backed up today.";
    if (days === 1) return "Last backup: 1 day ago.";
    return `Last backup: ${days} days ago.`;
  }

  // ---------- render ----------
  function render() {
    const viewDateKey = toDateKey(viewDate);
    const viewWeekKey = weekKeyOf(viewDate);
    const weekEntry = getWeekEntry(viewWeekKey);
    const viewWeekend = isWeekendDay(viewDate);
    const isToday = sameDate(viewDate, realToday);

    // quote (always today's real quote, not the viewed day's)
    const todayKey = toDateKey(realToday);
    const q = (quoteOverride && quoteOverride.date === todayKey) ? QUOTES[quoteOverride.index] : dailyQuote(realToday);
    document.getElementById("quoteText").textContent = "\u201C" + q.text + "\u201D";
    document.getElementById("quoteAuthor").textContent = "\u2014 " + q.author;

    document.getElementById("backupStatus").textContent = formatBackupStatus(localStorage.getItem(LAST_BACKUP_KEY));

    // nav
    document.getElementById("nextBtn").disabled = isToday;
    document.getElementById("jumpBtn").style.display = isToday ? "none" : "inline";
    document.getElementById("navDate").textContent = viewDate.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });

    document.getElementById("weekdayView").style.display = viewWeekend ? "none" : "block";
    document.getElementById("weekendView").style.display = viewWeekend ? "block" : "none";

    if (!viewWeekend) {
      const entry = getDayEntry(viewDateKey);
      const skipped = !!entry.skip;
      const activityChecked = !!entry.checks.activity;
      const choreChecked = !!entry.checks.chore;
      const staticDone = WEEKDAY_ITEMS.filter(i => entry.checks[i.key]).length;
      const done = staticDone + (activityChecked ? 1 : 0) + (choreChecked ? 1 : 0);
      const dayTotal = WEEKDAY_ITEMS.length + 2;
      document.getElementById("progressTrack").style.display = skipped ? "none" : "block";
      document.getElementById("progressSkipText").style.display = skipped ? "block" : "none";
      document.getElementById("progressSkipText").textContent = "Skipped — sick / vacation";
      document.getElementById("progressFill").style.width = Math.round((done / dayTotal) * 100) + "%";

      const board = document.getElementById("weekdayBoard");
      board.innerHTML = "";
      // 5 static items, then the activity slot, then the chore slot, then the
      // remaining static item — forms a clean 4-row x 2-col grid.
      const gridItems = [
        ...WEEKDAY_ITEMS.slice(0, 5).map(item => ({ kind: "static", item })),
        { kind: "activity" },
        { kind: "chore" },
        ...WEEKDAY_ITEMS.slice(5).map(item => ({ kind: "static", item })),
      ];
      gridItems.forEach((cell, idx) => {
        const row = Math.floor(idx / 2), col = idx % 2;
        const dark = (row + col) % 2 === 1;
        const btn = document.createElement("button");

        if (cell.kind === "activity") {
          const activityType = ACTIVITY_TYPES.find(a => a.key === entry.checks.activity);
          const moveStreak = movementStreak(viewDate);
          btn.className = "square " + (dark ? "sq-dark" : "sq-light") + (activityChecked ? " sq-checked" : "") + (moveStreak > 0 ? " has-streak" : "");
          btn.disabled = skipped;
          const displayEmoji = activityType ? activityType.emoji : "💪";
          const displayLabel = activityType ? activityType.label : "Activity";
          btn.innerHTML = `<span class="emoji">${displayEmoji}</span><span class="label">${escapeHTML(displayLabel)}</span>` +
            (moveStreak > 0 ? `<span class="streak-badge"><span class="streak-star">★</span>${moveStreak}</span>` : "");
          btn.addEventListener("click", () => {
            cycleActivity(entry);
            saveJSON(DAY_KEY, dayData);
            render();
          });
        } else if (cell.kind === "chore") {
          const suggested = getChoreForDate(viewDate);
          const doneKey = entry.checks.chore;
          const doneChore = [TRASH_CHORE, ...CHORE_POOL].find(c => c.key === doneKey);
          const displayChore = doneChore || suggested;
          const choreStreak = weekdayStreak("chore", viewDate);
          btn.className = "square " + (dark ? "sq-dark" : "sq-light") + (choreChecked ? " sq-checked" : "") + (choreStreak > 0 ? " has-streak" : "");
          btn.disabled = skipped;
          btn.innerHTML = `<span class="emoji">${displayChore.emoji}</span><span class="label">${escapeHTML(displayChore.label)}</span>` +
            (choreStreak > 0 ? `<span class="streak-badge"><span class="streak-star">★</span>${choreStreak}</span>` : "");
          btn.addEventListener("click", () => {
            cycleChore(entry, viewDate);
            saveJSON(DAY_KEY, dayData);
            render();
          });
        } else {
          const item = cell.item;
          const checked = !!entry.checks[item.key];
          const streak = CROSS_DAY_STREAK_KEYS.includes(item.key) ? unifiedStreak(item.key, viewDate) : weekdayStreak(item.key, viewDate);
          const displayLabel = item.label;
          const displayEmoji = item.emoji;
          btn.className = "square " + (dark ? "sq-dark" : "sq-light") + (checked ? " sq-checked" : "") + (streak > 0 ? " has-streak" : "");
          btn.disabled = skipped;
          btn.innerHTML = `<span class="emoji">${displayEmoji}</span><span class="label">${escapeHTML(displayLabel)}</span>` +
            (streak > 0 ? `<span class="streak-badge"><span class="streak-star">★</span>${streak}</span>` : "");
          btn.addEventListener("click", () => {
            entry.checks[item.key] = !entry.checks[item.key];
            saveJSON(DAY_KEY, dayData);
            render();
          });
        }
        board.appendChild(btn);
      });

      const skipBtn = document.getElementById("skipDayBtn");
      skipBtn.className = "skip-btn" + (skipped ? " active" : "");
      skipBtn.textContent = skipped ? "🤒 Skipped — tap to undo" : "🤒 Sick / vacation — skip today";
    } else {
      const wEntry = getWeekendEntry(viewWeekKey);
      const dayEntry = getDayEntry(viewDateKey);
      const skipped = !!dayEntry.skip;

      const activityChecked = !!dayEntry.checks.activity;
      const staticDoneWeekend = WEEKEND_DUAL_ITEMS.filter(i => dayEntry.checks[i.key]).length;
      const done = staticDoneWeekend + (activityChecked ? 1 : 0);
      document.getElementById("weekendProgressTrack").style.display = skipped ? "none" : "block";
      document.getElementById("weekendProgressSkipText").style.display = skipped ? "block" : "none";
      document.getElementById("weekendProgressSkipText").textContent = "Skipped \u2014 sick / vacation";
      document.getElementById("weekendProgressFill").style.width = Math.round((done / (WEEKEND_DUAL_ITEMS.length + 1)) * 100) + "%";

      const weekendBoard = document.getElementById("weekendBoard");
      weekendBoard.innerHTML = "";
      // 3 static items, then the activity slot, then the remaining 2 static items --
      // matches the weekday grid's item/activity arrangement.
      const weekendGridItems = [
        ...WEEKEND_DUAL_ITEMS.slice(0, 3).map(item => ({ kind: "static", item })),
        { kind: "activity" },
        ...WEEKEND_DUAL_ITEMS.slice(3).map(item => ({ kind: "static", item })),
      ];
      weekendGridItems.forEach((cell, idx) => {
        const row = Math.floor(idx / 2), col = idx % 2;
        const dark = (row + col) % 2 === 1;
        const btn = document.createElement("button");

        if (cell.kind === "activity") {
          const activityType = ACTIVITY_TYPES.find(a => a.key === dayEntry.checks.activity);
          const moveStreak = movementStreak(viewDate);
          btn.className = "square " + (dark ? "sq-dark" : "sq-light") + (activityChecked ? " sq-checked" : "") + (moveStreak > 0 ? " has-streak" : "");
          btn.disabled = skipped;
          const displayEmoji = activityType ? activityType.emoji : "💪";
          const displayLabel = activityType ? activityType.label : "Activity";
          btn.innerHTML = `<span class="emoji">${displayEmoji}</span><span class="label">${escapeHTML(displayLabel)}</span>` +
            (moveStreak > 0 ? `<span class="streak-badge"><span class="streak-star">★</span>${moveStreak}</span>` : "");
          btn.addEventListener("click", () => {
            cycleActivity(dayEntry);
            saveJSON(DAY_KEY, dayData);
            render();
          });
        } else {
          const item = cell.item;
          const checked = !!dayEntry.checks[item.key];
          const streak = CROSS_DAY_STREAK_KEYS.includes(item.key) ? unifiedStreak(item.key, viewDate) : weekendStreak(item.key, viewDate);
          btn.className = "square " + (dark ? "sq-dark" : "sq-light") + (checked ? " sq-checked" : "") + (streak > 0 ? " has-streak" : "");
          btn.disabled = skipped;
          btn.innerHTML = `<span class="emoji">${item.emoji}</span><span class="label">${escapeHTML(item.label)}</span>` +
            (streak > 0 ? `<span class="streak-badge"><span class="streak-star">★</span>${streak}</span>` : "");
          btn.addEventListener("click", () => {
            dayEntry.checks[item.key] = !dayEntry.checks[item.key];
            saveJSON(DAY_KEY, dayData);
            render();
          });
        }
        weekendBoard.appendChild(btn);
      });

      const skipWeekendBtn = document.getElementById("skipWeekendBtn");
      skipWeekendBtn.className = "skip-btn" + (skipped ? " active" : "");
      skipWeekendBtn.textContent = skipped ? "\ud83e\udd12 Skipped \u2014 tap to undo" : "\ud83e\udd12 Sick / vacation \u2014 skip today";

      document.getElementById("regularBtn").className = "mode-btn" + (wEntry.mode !== "sophie" ? " active" : "");
      document.getElementById("sophieBtn").className = "mode-btn" + (wEntry.mode === "sophie" ? " active" : "");

      const extraBoard = document.getElementById("extraBoard");
      extraBoard.innerHTML = "";
      if (wEntry.mode !== "sophie") {
        WEEKEND_EXTRA_ITEMS.forEach((item, idx) => {
          const row = Math.floor(idx / 2), col = idx % 2;
          const dark = (row + col) % 2 === 1;
          const checked = !!wEntry.extra[item.key];
          const btn = document.createElement("button");
          btn.className = "square " + (dark ? "sq-dark" : "sq-light") + (checked ? " sq-checked" : "");
          btn.innerHTML = `<span class="emoji">${item.emoji}</span><span class="label">${escapeHTML(item.label)}</span>`;
          btn.addEventListener("click", () => {
            wEntry.extra[item.key] = !wEntry.extra[item.key];
            saveJSON(WEEKEND_KEY, weekendData);
            render();
          });
          extraBoard.appendChild(btn);
        });
      }

      const recapPanel = document.getElementById("recapPanel");
      if (viewDate.getDay() === 0) {
        recapPanel.style.display = "block";
        const monday = mondayOf(viewDate);
        let totalDone = 0, totalPossible = 0, skippedDays = 0;
        for (let i = 0; i < 7; i++) {
          const d = addDays(monday, i);
          const dEntry = dayData[toDateKey(d)];
          if (dEntry && dEntry.skip) { skippedDays++; continue; }
          const isW = isWeekendDay(d);
          const itemList = isW ? WEEKEND_DUAL_ITEMS : WEEKDAY_ITEMS;
          const staticDone = dEntry ? itemList.filter(it => dEntry.checks[it.key]).length : 0;
          const activityDone = dEntry && dEntry.checks.activity ? 1 : 0;
          const choreDone = !isW && dEntry && dEntry.checks.chore ? 1 : 0;
          totalDone += staticDone + activityDone + choreDone;
          totalPossible += itemList.length + (isW ? 1 : 2);
        }
        const pct = totalPossible > 0 ? Math.round((totalDone / totalPossible) * 100) : 0;
        document.getElementById("recapFill").style.width = pct + "%";
        document.getElementById("recapPct").textContent = pct + "%";
        const extraParts = [`${totalDone}/${totalPossible} items`];
        if (skippedDays) extraParts.push(`${skippedDays} skipped`);
        extraParts.push(`🧘 ${weekEntry.meditationCount}/${MEDITATION_TARGET}`);
        extraParts.push(`🍳 ${weekEntry.cookingCount}/${COOKING_TARGET}`);
        document.getElementById("recapExtra").textContent = extraParts.join(" · ");
      } else {
        recapPanel.style.display = "none";
      }
    }

    // history strip (always anchored to real today)
    const strip = document.getElementById("historyStrip");
    strip.innerHTML = "";
    last7Days(realToday).forEach(d => {
      const key = toDateKey(d);
      const isW = isWeekendDay(d);
      const rec = dayData[key];
      const skipped = !!(rec && rec.skip);
      const done = rec ? Object.values(rec.checks || {}).filter(Boolean).length : 0;
      const ratio = done / ((isW ? WEEKEND_DUAL_ITEMS.length : WEEKDAY_ITEMS.length) + (isW ? 1 : 2));
      const isTodayCol = key === toDateKey(realToday);
      const isViewedCol = sameDate(d, viewDate);
      const col = document.createElement("button");
      col.className = "history-col";
      const bar = document.createElement("div");
      bar.className = "history-bar";
      bar.style.height = (skipped ? 20 : Math.max(6, ratio * 32)) + "px";
      bar.style.background = skipped ? "var(--muted2)" : (isW ? "var(--teal)" : (ratio >= 1 ? "var(--gold)" : ratio > 0 ? "var(--olive)" : "var(--history-empty)"));
      bar.style.outline = isTodayCol ? "1px solid var(--ink)" : (isViewedCol ? "1px solid var(--gold)" : "none");
      const lbl = document.createElement("div");
      lbl.className = "history-label";
      lbl.textContent = d.toLocaleDateString(undefined, { weekday: "narrow" });
      col.appendChild(bar); col.appendChild(lbl);
      col.addEventListener("click", () => { viewDate = new Date(d); render(); });
      strip.appendChild(col);
    });

    // weekly counters
    renderDots("medDots", weekEntry.meditationCount, MEDITATION_TARGET);
    renderDots("cookDots", weekEntry.cookingCount, COOKING_TARGET);
    renderDots("liftDots", countActivityThisWeek("lifting", viewDate), LIFTING_TARGET);
    renderDots("cycleDots", countActivityThisWeek("cycling", viewDate), CYCLING_TARGET);

    const medStreak = weeklyCounterStreak("meditationCount", MEDITATION_TARGET, viewDate);
    const cookStreak = weeklyCounterStreak("cookingCount", COOKING_TARGET, viewDate);
    document.getElementById("medLabel").innerHTML = "🧘 Meditation" + (medStreak > 0 ? `<span class="streak-mini"><span class="streak-star">★</span>${medStreak}wk</span>` : "");
    document.getElementById("cookLabel").innerHTML = "🍳 Cooked at home" + (cookStreak > 0 ? `<span class="streak-mini"><span class="streak-star">★</span>${cookStreak}wk</span>` : "");
  }

  function renderDots(id, count, target) {
    const el = document.getElementById(id);
    el.innerHTML = "";
    for (let i = 0; i < target; i++) {
      const d = document.createElement("span");
      d.className = "dot" + (i < count ? " filled" : "");
      el.appendChild(d);
    }
  }

  // ---------- events ----------
  document.getElementById("quoteRefreshBtn").addEventListener("click", () => {
    const todayKey = toDateKey(realToday);
    const current = (quoteOverride && quoteOverride.date === todayKey) ? quoteOverride.index : QUOTES.indexOf(dailyQuote(realToday));
    let next;
    do { next = Math.floor(Math.random() * QUOTES.length); } while (next === current && QUOTES.length > 1);
    quoteOverride = { date: todayKey, index: next };
    saveJSON(QUOTE_OVERRIDE_KEY, quoteOverride);
    render();
  });
  document.getElementById("prevBtn").addEventListener("click", () => { viewDate = addDays(viewDate, -1); render(); });
  document.getElementById("nextBtn").addEventListener("click", () => {
    if (!sameDate(viewDate, realToday)) { viewDate = addDays(viewDate, 1); render(); }
  });
  document.getElementById("jumpBtn").addEventListener("click", () => { viewDate = new Date(realToday); render(); });

  document.getElementById("skipDayBtn").addEventListener("click", () => {
    const entry = getDayEntry(toDateKey(viewDate));
    entry.skip = !entry.skip;
    saveJSON(DAY_KEY, dayData); render();
  });
  document.getElementById("skipWeekendBtn").addEventListener("click", () => {
    const entry = getDayEntry(toDateKey(viewDate));
    entry.skip = !entry.skip;
    saveJSON(DAY_KEY, dayData); render();
  });

  document.getElementById("regularBtn").addEventListener("click", () => {
    const wEntry = getWeekendEntry(weekKeyOf(viewDate));
    wEntry.mode = "regular"; saveJSON(WEEKEND_KEY, weekendData); render();
  });
  document.getElementById("sophieBtn").addEventListener("click", () => {
    const wEntry = getWeekendEntry(weekKeyOf(viewDate));
    wEntry.mode = "sophie"; saveJSON(WEEKEND_KEY, weekendData); render();
  });

  document.getElementById("medPlus").addEventListener("click", () => {
    const wk = getWeekEntry(weekKeyOf(viewDate));
    wk.meditationCount = Math.min(MEDITATION_TARGET, wk.meditationCount + 1);
    saveJSON(WEEK_KEY, weekData); render();
  });
  document.getElementById("medReset").addEventListener("click", () => {
    const wk = getWeekEntry(weekKeyOf(viewDate));
    wk.meditationCount = 0; saveJSON(WEEK_KEY, weekData); render();
  });
  document.getElementById("cookPlus").addEventListener("click", () => {
    const wk = getWeekEntry(weekKeyOf(viewDate));
    wk.cookingCount = Math.min(COOKING_TARGET, wk.cookingCount + 1);
    saveJSON(WEEK_KEY, weekData); render();
  });
  document.getElementById("cookReset").addEventListener("click", () => {
    const wk = getWeekEntry(weekKeyOf(viewDate));
    wk.cookingCount = 0; saveJSON(WEEK_KEY, weekData); render();
  });

  document.getElementById("exportBtn").addEventListener("click", () => {
    const allCols = WEEKDAY_ITEMS.map(i => ({ key: i.key, label: i.label }));
    const rows = [["date", ...allCols.map(i => i.label), "Activity", "Chore"]];
    Object.keys(dayData).sort().forEach(date => {
      const entry = dayData[date] || { checks: {} };
      rows.push([date, ...allCols.map(i => entry.checks[i.key] ? "1" : "0"), entry.checks.activity || "", entry.checks.chore || ""]);
    });
    const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "weekly-board-export.csv"; a.click();
    URL.revokeObjectURL(url);
  });

  document.getElementById("backupBtn").addEventListener("click", () => {
    const backup = { version: 1, exportedAt: new Date().toISOString(), day: dayData, weekend: weekendData, week: weekData };
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `weekly-board-backup-${toDateKey(new Date())}.json`; a.click();
    URL.revokeObjectURL(url);
    localStorage.setItem(LAST_BACKUP_KEY, new Date().toISOString());
    render();
  });

  document.getElementById("restoreBtn").addEventListener("click", () => {
    document.getElementById("restoreInput").click();
  });
  document.getElementById("restoreInput").addEventListener("change", (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let backup;
      try { backup = JSON.parse(reader.result); }
      catch (err) { alert("That file isn't valid backup JSON."); return; }
      if (!backup || typeof backup !== "object" || !backup.day || !backup.weekend || !backup.week) {
        alert("That file doesn't look like a Weekly Board backup.");
        return;
      }
      if (!confirm("This replaces all data currently saved in this browser with the backup file. Continue?")) return;
      dayData = backup.day;
      weekendData = backup.weekend;
      weekData = backup.week;
      saveJSON(DAY_KEY, dayData);
      saveJSON(WEEKEND_KEY, weekendData);
      saveJSON(WEEK_KEY, weekData);
      render();
    };
    reader.readAsText(file);
  });

  render();
</script>
</body>
</html>
